feature tacacs+
feature dot1x
feature port-security
feature dhcp
hostname nx1
radius-server host 10.1.1.1 key 0 RADKEY auth-port 1645 acct-port 1646 timeout 5
tacacs-server host 10.1.1.2 key 0 TACKEY port 4949 timeout 7
aaa group server radius RAD
  server 10.1.1.1
  use-vrf management
  source-interface mgmt0
aaa group server tacacs+ TAC
  server 10.1.1.2
  use-vrf management
ip radius source-interface mgmt0
ip tacacs source-interface mgmt0
aaa authentication login default group TAC local
aaa authentication login console group TAC local
aaa authorization commands default group TAC local
aaa accounting default group TAC
aaa authentication dot1x default group RAD
ip dhcp snooping
ip dhcp snooping vlan 10,20
ip dhcp snooping information option
ip arp inspection vlan 10
snmp-server user ops network-operator auth sha AUTHPASS priv aes-128 PRIVPASS
snmp-server host 10.9.9.9 traps version 2c PUBLIC
snmp-server host 10.9.9.9 use-vrf management
snmp-server host 10.9.9.10 informs version 3 priv ops
snmp-server source-interface traps mgmt0
snmp-server enable traps bgp
snmp-server community PUB group network-operator
snmp-server community PUB use-acl MGMT
ip ftp source-interface mgmt0
interface Ethernet1/1
  switchport
  switchport access vlan 10
  dot1x pae authenticator
  dot1x port-control auto
  dot1x host-mode multi-host
  dot1x mac-auth-bypass
  dot1x re-authentication
  dot1x timeout re-authperiod 3600
  switchport port-security
  switchport port-security maximum 3
  switchport port-security violation restrict
  ip dhcp snooping trust
  ip arp inspection trust
  ip verify source dhcp-snooping-vlan
interface Vlan10
  no autostate
  mac-address 0011.2233.4455
  ip address 10.0.10.1/24
  ip verify unicast source reachable-via rx
  no ip redirects
  no ip unreachables
  ip proxy-arp
  ip dhcp relay address 10.5.5.5 use-vrf PROD
  ip dhcp relay source-interface loopback0
interface Ethernet1/2
  no switchport
  medium p2p
  ip unnumbered loopback0
interface loopback0
  ip address 10.255.0.1/32
