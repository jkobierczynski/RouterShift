#
 version 7.1.070, Release 6328
#
 sysname sw-access-04
#
 clock timezone CET add 01:00:00
#
 info-center loghost vpn-instance mgmt 10.0.5.14
#
 dns domain example.net
 dns server 10.0.0.53 vpn-instance mgmt
#
 ntp-service enable
 ntp-service unicast-server 10.0.0.123 vpn-instance mgmt
#
ip vpn-instance mgmt
#
ip vpn-instance PROD
 route-distinguisher 65000:1
#
 irf mac-address persistent timer
#
 lldp global enable
#
 stp mode rstp
 stp bpdu-protection
 stp global enable
#
vlan 1
#
vlan 10
 name USERS
#
vlan 20
 name VOICE
#
vlan 99
 name MGMT
#
acl advanced name USERS-IN
 rule 0 permit tcp source 10.10.0.0 0.0.0.255 destination-port eq 443
 rule 0 comment allow web
 rule 5 permit icmp icmp-type echo
 rule 10 deny ip logging
#
interface Bridge-Aggregation1
 description uplink core
 port link-type trunk
 undo port trunk permit vlan 1
 port trunk permit vlan 10 20 99
 port trunk pvid vlan 99
 link-aggregation mode dynamic
#
interface NULL0
#
interface LoopBack0
 ip address 10.255.255.4 255.255.255.255
#
interface Vlan-interface10
 ip binding vpn-instance PROD
 ip address 10.10.0.1 255.255.255.0
 packet-filter name USERS-IN inbound
 vrrp vrid 10 virtual-ip 10.10.0.254
 vrrp vrid 10 priority 120
 vrrp vrid 10 timer advertise 200
#
interface Vlan-interface99
 ip address 10.99.0.14 255.255.255.0
 dhcp select relay
 dhcp relay server-address 10.0.0.67
 ospf cost 30
#
interface M-GigabitEthernet0/0/0
 ip binding vpn-instance mgmt
 ip address 192.168.255.14 255.255.255.0
#
interface GigabitEthernet1/0/1
 port link-mode bridge
 description desk 1.04
 port link-type hybrid
 port hybrid vlan 20 tagged
 port hybrid vlan 10 untagged
 port hybrid pvid vlan 10
 voice-vlan 20 enable
 stp edged-port
#
interface GigabitEthernet1/0/2
 port link-mode bridge
 description printer
 shutdown
 speed 100
 duplex full
 port access vlan 10
 stp edged-port
#
interface GigabitEthernet1/0/3
 port link-mode bridge
 port access vlan 10
#
interface GigabitEthernet1/0/48
 port link-mode route
 description wan
 ip address 10.255.0.5 255.255.255.254
#
interface Ten-GigabitEthernet1/0/49
 port link-mode bridge
 port link-type trunk
 undo port trunk permit vlan 1
 port trunk permit vlan 10 20 99
 port trunk pvid vlan 99
 port link-aggregation group 1
#
interface Ten-GigabitEthernet1/0/50
 port link-mode bridge
 port link-type trunk
 undo port trunk permit vlan 1
 port trunk permit vlan 10 20 99
 port trunk pvid vlan 99
 port link-aggregation group 1
#
 dhcp enable
 dhcp server forbidden-ip 10.10.0.1 10.10.0.49 vpn-instance PROD
#
dhcp server ip-pool USERS
 network 10.10.0.0 mask 255.255.255.0
 gateway-list 10.10.0.1
 dns-list 10.0.0.53
 expired day 0 hour 12
 vpn-instance PROD
#
ospf 1 router-id 10.255.255.4
 silent-interface all
 undo silent-interface Vlan-interface99
 import-route direct
 area 0.0.0.0
  network 10.99.0.0 0.0.0.255
#
bgp 65020
 router-id 10.255.255.4
 peer 10.99.0.1 as-number 65000
 peer 10.99.0.1 ebgp-max-hop 2
 #
 address-family ipv4 unicast
  network 10.10.0.0 255.255.255.0
  import-route static
  peer 10.99.0.1 enable
#
 ip route-static 0.0.0.0 0 10.99.0.1
 ip route-static 10.50.0.0 255.255.0.0 10.255.0.4 preference 250 description backup path
 ip route-static vpn-instance PROD 10.200.0.0 16 NULL0
 ip route-static vpn-instance mgmt 0.0.0.0 0 192.168.255.1
