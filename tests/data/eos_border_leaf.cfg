! =============================================================================
! device: bl1-dc1  (DCS-7280CR3-32P4, EOS-4.32.x)
! Role  : DC1 border leaf #1 (MLAG pair bl1/bl2) - EVPN/VXLAN fabric edge,
!         Internet edge (eBGP to two ISPs), DCI (MACsec), legacy OSPF core
!
! Addressing plan (documentation / RFC1918 ranges only)
!   Loopback0   (router-id / EVPN)   10.255.0.21/32   (bl2 = .22)
!   Loopback1   (shared VTEP)        10.255.1.21/32   (same on bl2)
!   Loopback100 (VRF PROD diag)      10.255.100.21/32
!   Spine P2P underlay               10.0.1.0/31 .. 10.0.1.6/31
!   MLAG peer-link SVI (VLAN 4094)   10.255.252.0/31
!   MLAG iBGP SVI      (VLAN 4093)   10.255.251.0/31
!   ISP-A (AS64496)                  198.51.100.0/31
!   ISP-B (AS64497)                  198.51.100.2/31
!   Public aggregate                 203.0.113.0/24
!   Fabric ASN: spines 65000, this MLAG pair 65021
!
! All secrets below are PLACEHOLDERS - replace before deployment.
! =============================================================================
!
service routing protocols model multi-agent
service configuration session max completed 20
service configuration session max pending 5
!
hostname bl1-dc1
dns domain dc1.example.net
ip domain lookup vrf MGMT source-interface Management1
ip name-server vrf MGMT 10.100.0.53
ip name-server vrf MGMT 10.100.1.53
!
load-interval default 30
!
banner login
*****************************************************************
*  AUTHORIZED ACCESS ONLY. All activity is logged and monitored. *
*  Disconnect immediately if you are not an authorized user.     *
*****************************************************************
EOF
!
! -----------------------------------------------------------------------------
! Telemetry / CloudVision
! -----------------------------------------------------------------------------
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=10.100.0.10:9910,10.100.0.11:9910 -cvauth=token,/tmp/token -cvvrf=MGMT -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs
   no shutdown
!
! -----------------------------------------------------------------------------
! Hardware / platform
! -----------------------------------------------------------------------------
hardware counter feature ip in
hardware counter feature ip out
hardware counter feature vlan-interface in
hardware counter feature vlan-interface out
hardware counter feature vtep decap
hardware counter feature vtep encap
!
platform sand lag hardware-only
platform sand qos map traffic-class 7 to network-qos 7
!
hardware tcam
   system profile vxlan-routing
!
! -----------------------------------------------------------------------------
! Switching: spanning tree, VLANs, LLDP, storm control defaults
! -----------------------------------------------------------------------------
spanning-tree mode mstp
spanning-tree mst 0 priority 4096
no spanning-tree vlan-id 4093-4094
spanning-tree edge-port bpduguard default
spanning-tree mst configuration
   name DC1-BL
   revision 3
   instance 1 vlan 100-199
   instance 2 vlan 200-299
!
errdisable recovery cause bpduguard
errdisable recovery cause link-flap
errdisable recovery cause portsec
errdisable recovery interval 300
!
vlan internal order ascending range 3700 3900
!
vlan 100
   name PROD-WEB
!
vlan 110
   name PROD-APP
!
vlan 120
   name PROD-DB
!
vlan 200
   name DEV-WEB
!
vlan 210
   name DEV-APP
!
vlan 300
   name DMZ-PUBLIC
!
vlan 310
   name DMZ-PROXY
!
vlan 900
   name OOB-LEGACY
!
vlan 3010
   name L3-PROD-MLAG-PEER
   trunk group LEAF_PEER_L3
!
vlan 3020
   name L3-DEV-MLAG-PEER
   trunk group LEAF_PEER_L3
!
vlan 3030
   name L3-DMZ-MLAG-PEER
   trunk group LEAF_PEER_L3
!
vlan 4093
   name LEAF_PEER_L3
   trunk group LEAF_PEER_L3
!
vlan 4094
   name MLAG_PEER
   trunk group MLAG
!
lldp timer 15
lldp hold-time 60
lldp management-address Management1
lldp management-address vrf MGMT
!
! -----------------------------------------------------------------------------
! VRFs
! -----------------------------------------------------------------------------
vrf instance MGMT
   description Out-of-band management
!
vrf instance PROD
   description Production tenant
!
vrf instance DEV
   description Development tenant
!
vrf instance DMZ
   description Internet-facing services
!
vrf instance INET
   description Internet edge (ISP peering)
!
! -----------------------------------------------------------------------------
! AAA, users, roles
! -----------------------------------------------------------------------------
aaa authorization exec default group TACACS-GRP local
aaa authorization commands all default group TACACS-GRP local
aaa authentication login default group TACACS-GRP local
aaa authentication login console local
aaa authentication enable default group TACACS-GRP local
aaa accounting exec default start-stop group TACACS-GRP logging
aaa accounting commands all default start-stop group TACACS-GRP logging
aaa authentication policy local allow-nopassword-remote-login
aaa authentication policy on-failure log
aaa authentication policy on-success log
!
aaa group server tacacs+ TACACS-GRP
   server 10.100.0.20 vrf MGMT
   server 10.100.1.20 vrf MGMT
!
aaa group server radius DOT1X-GRP
   server 10.100.0.30 vrf MGMT
   server 10.100.1.30 vrf MGMT
!
tacacs-server key 7 <TACACS_KEY_PLACEHOLDER>
tacacs-server timeout 5
tacacs-server host 10.100.0.20 vrf MGMT
tacacs-server host 10.100.1.20 vrf MGMT
ip tacacs vrf MGMT source-interface Management1
!
radius-server key 7 <RADIUS_KEY_PLACEHOLDER>
radius-server host 10.100.0.30 vrf MGMT
radius-server host 10.100.1.30 vrf MGMT
ip radius vrf MGMT source-interface Management1
!
role NOC-READONLY
   10 permit mode exec command show|ping|traceroute|bash timeout
   20 deny mode exec command .*
   30 deny mode config-all command .*
!
no enable password
no aaa root
username admin privilege 15 role network-admin secret sha512 <HASH_PLACEHOLDER>
username automation privilege 15 role network-admin secret sha512 <HASH_PLACEHOLDER>
username automation ssh-key ssh-ed25519 AAAA<PUBKEY_PLACEHOLDER> automation@ci
username noc privilege 1 role NOC-READONLY secret sha512 <HASH_PLACEHOLDER>
!
! -----------------------------------------------------------------------------
! Management plane: SSH, eAPI, gNMI, NTP, logging, SNMPv3, sFlow
! -----------------------------------------------------------------------------
management console
   idle-timeout 15
!
management ssh
   idle-timeout 30
   authentication mode password
   cipher aes256-gcm@openssh.com aes256-ctr
   key-exchange curve25519-sha256 ecdh-sha2-nistp384
   mac hmac-sha2-512-etm@openssh.com hmac-sha2-256-etm@openssh.com
   hostkey server ecdsa-nistp384 ed25519
   ip access-group ACL-MGMT-IN vrf MGMT in
   vrf MGMT
      no shutdown
   shutdown
!
management security
   ssl profile EAPI-TLS
      tls versions 1.2 1.3
      certificate eapi.crt key eapi.key
   password
      minimum length 12
!
management api http-commands
   protocol https ssl profile EAPI-TLS
   no shutdown
   vrf MGMT
      no shutdown
      ip access-group ACL-MGMT-IN
!
management api gnmi
   transport grpc MGMT
      vrf MGMT
      ip access-group ACL-MGMT-IN
   provider eos-native
!
management api netconf
   transport ssh MGMT
      vrf MGMT
!
ntp authentication-key 1 sha1 7 <NTP_KEY_PLACEHOLDER>
ntp trusted-key 1
ntp authenticate
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 10.100.0.123 prefer iburst key 1
ntp server vrf MGMT 10.100.1.123 iburst key 1
clock timezone Europe/Brussels
!
logging buffered 64000 debugging
logging console errors
logging trap informational
logging host 10.100.0.50 514 protocol udp
logging vrf MGMT host 10.100.0.50 514 protocol udp
logging vrf MGMT host 10.100.1.50 6514 protocol tls
logging vrf MGMT source-interface Management1
logging format timestamp high-resolution
logging format hostname fqdn
logging level BGP informational
logging level MLAG informational
logging event link-status global
!
snmp-server engineID local 000000000000000000BEEF21
snmp-server contact noc@example.net
snmp-server location "DC1 Hall-A Row-3 Rack-12 U40"
snmp-server view ALL-VIEW iso included
snmp-server view RESTRICTED iso included
snmp-server view RESTRICTED snmpUsmMIB excluded
snmp-server view RESTRICTED snmpVacmMIB excluded
snmp-server group NMS-RO v3 priv read RESTRICTED
snmp-server group NMS-RW v3 priv read ALL-VIEW write ALL-VIEW
snmp-server user nms-poller NMS-RO v3 auth sha512 <AUTH_PLACEHOLDER> priv aes256 <PRIV_PLACEHOLDER>
snmp-server host 10.100.0.60 vrf MGMT version 3 priv nms-poller
snmp-server enable traps bgp
snmp-server enable traps entity
snmp-server enable traps lldp
snmp-server enable traps mlag
snmp-server enable traps snmp link-down
snmp-server enable traps snmp link-up
snmp-server vrf MGMT local-interface Management1
snmp-server ipv4 access-list ACL-SNMP vrf MGMT
no snmp-server vrf default
!
sflow sample 16384
sflow polling-interval 30
sflow vrf MGMT destination 10.100.0.70 6343
sflow vrf MGMT source-interface Management1
sflow extension bgp
sflow run
!
! -----------------------------------------------------------------------------
! Access lists
! -----------------------------------------------------------------------------
ip access-list ACL-MGMT-IN
   10 remark Jump hosts and NMS
   20 permit tcp 10.100.0.0/23 any eq ssh https 6030
   30 permit icmp 10.100.0.0/23 any
   40 permit udp 10.100.0.0/23 any eq snmp
   1000 deny ip any any log
!
ip access-list standard ACL-SNMP
   10 permit 10.100.0.0/23
!
ip access-list ACL-DMZ-IN
   10 remark Public services only
   20 permit tcp any 203.0.113.0/26 eq www https
   30 permit udp any 203.0.113.53/32 eq domain
   40 permit tcp any 203.0.113.53/32 eq domain
   50 permit icmp any any echo-reply
   60 permit icmp any any unreachable
   70 permit icmp any any time-exceeded
   1000 deny ip any any log
!
ip access-list ACL-INET-EDGE-IN
   counters per-entry
   10 remark Anti-spoofing (BCP38/84)
   20 deny ip 0.0.0.0/8 any
   30 deny ip 10.0.0.0/8 any
   40 deny ip 100.64.0.0/10 any
   50 deny ip 127.0.0.0/8 any
   60 deny ip 169.254.0.0/16 any
   70 deny ip 172.16.0.0/12 any
   80 deny ip 192.168.0.0/16 any
   90 deny ip 224.0.0.0/3 any
   100 deny ip 203.0.113.0/24 any
   110 remark Allow BGP from ISP peers only
   120 permit tcp host 198.51.100.0 host 198.51.100.1 eq bgp
   130 permit tcp host 198.51.100.0 eq bgp host 198.51.100.1
   140 permit tcp host 198.51.100.2 host 198.51.100.3 eq bgp
   150 permit tcp host 198.51.100.2 eq bgp host 198.51.100.3
   160 permit udp host 198.51.100.0 host 198.51.100.1 eq 3784
   170 permit udp host 198.51.100.2 host 198.51.100.3 eq 3784
   180 deny tcp any any eq bgp log
   1000 permit ip any any
!
ipv6 access-list ACL6-INET-EDGE-IN
   10 deny ipv6 2001:db8:203::/48 any
   20 deny ipv6 fc00::/7 any
   30 permit ipv6 any any
!
ip access-list ACL-PBR-SCRUBBER
   10 permit ip any 203.0.113.80/28
!
mac access-list MACL-PROTECT-LEGACY
   10 deny any any vlan 900 0xfff protocol 0x88cc
   20 permit any any
!
! -----------------------------------------------------------------------------
! Prefix lists, community lists, as-path lists, route maps
! -----------------------------------------------------------------------------
ip prefix-list PL-LOOPBACKS
   seq 10 permit 10.255.0.0/24 eq 32
   seq 20 permit 10.255.1.0/24 eq 32
!
ip prefix-list PL-PUBLIC-AGG
   seq 10 permit 203.0.113.0/24
!
ip prefix-list PL-DEFAULT
   seq 10 permit 0.0.0.0/0
!
ip prefix-list PL-BOGONS
   seq 10 permit 0.0.0.0/8 le 32
   seq 20 permit 10.0.0.0/8 le 32
   seq 30 permit 100.64.0.0/10 le 32
   seq 40 permit 127.0.0.0/8 le 32
   seq 50 permit 169.254.0.0/16 le 32
   seq 60 permit 172.16.0.0/12 le 32
   seq 70 permit 192.0.2.0/24 le 32
   seq 80 permit 192.168.0.0/16 le 32
   seq 90 permit 198.18.0.0/15 le 32
   seq 100 permit 224.0.0.0/3 le 32
!
ip prefix-list PL-TOO-SPECIFIC
   seq 10 permit 0.0.0.0/0 ge 25
!
ip prefix-list PL-OSPF-LEGACY-IN
   seq 10 permit 172.20.0.0/16 le 24
!
ipv6 prefix-list PL6-PUBLIC-AGG
   seq 10 permit 2001:db8:203::/48
!
ip community-list CL-BLACKHOLE permit 65535:666
ip community-list CL-FROM-ISP-A permit 65021:1001
ip community-list CL-FROM-ISP-B permit 65021:1002
ip community-list CL-NO-EXPORT-INET permit 65021:9999
!
ip as-path regex-mode asn
ip as-path access-list AS-ISP-A permit ^64496( 64496)*$ any
ip as-path access-list AS-LONG permit ^([0-9]+ ){50,}[0-9]+$ any
!
route-map RM-CONN-TO-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
route-map RM-MLAG-PEER-IN permit 10
   set origin incomplete
!
route-map RM-ISP-A-IN deny 10
   match ip address prefix-list PL-BOGONS
!
route-map RM-ISP-A-IN deny 20
   match ip address prefix-list PL-TOO-SPECIFIC
!
route-map RM-ISP-A-IN deny 30
   match as-path AS-LONG
!
route-map RM-ISP-A-IN deny 40
   match ip address prefix-list PL-PUBLIC-AGG
!
route-map RM-ISP-A-IN permit 100
   match ip address prefix-list PL-DEFAULT
   set local-preference 200
   set community 65021:1001 additive
!
route-map RM-ISP-A-IN permit 200
   set local-preference 150
   set community 65021:1001 additive
!
route-map RM-ISP-B-IN deny 10
   match ip address prefix-list PL-BOGONS
!
route-map RM-ISP-B-IN deny 20
   match ip address prefix-list PL-TOO-SPECIFIC
!
route-map RM-ISP-B-IN deny 30
   match as-path AS-LONG
!
route-map RM-ISP-B-IN deny 40
   match ip address prefix-list PL-PUBLIC-AGG
!
route-map RM-ISP-B-IN permit 100
   set local-preference 100
   set community 65021:1002 additive
!
route-map RM-ISP-A-OUT permit 10
   match ip address prefix-list PL-PUBLIC-AGG
!
route-map RM-ISP-A-OUT permit 20
   match community CL-BLACKHOLE
   set community 64496:666
!
route-map RM-ISP-A-OUT deny 1000
!
route-map RM-ISP-B-OUT permit 10
   match ip address prefix-list PL-PUBLIC-AGG
   set as-path prepend 65021 65021 65021
!
route-map RM-ISP-B-OUT deny 1000
!
route-map RM-INET-TO-EVPN permit 10
   match ip address prefix-list PL-DEFAULT
   set extcommunity rt 65021:400 additive
!
route-map RM-INET-TO-EVPN deny 1000
!
route-map RM-EVPN-EXPORT-DMZ deny 10
   match community CL-NO-EXPORT-INET
!
route-map RM-EVPN-EXPORT-DMZ permit 100
!
route-map RM-OSPF-LEGACY-IN permit 10
   match ip address prefix-list PL-OSPF-LEGACY-IN
   set tag 172
!
route-map RM-OSPF-LEGACY-IN deny 1000
!
route-map RM-BGP-TO-OSPF permit 10
   match ip address prefix-list PL-DEFAULT
   set metric 100
   set metric-type type-1
!
! -----------------------------------------------------------------------------
! QoS
! -----------------------------------------------------------------------------
qos map dscp 46 to traffic-class 5
qos map dscp 34 36 38 to traffic-class 4
qos map dscp 26 28 30 to traffic-class 3
qos map dscp 18 20 22 to traffic-class 2
qos map dscp 48 56 to traffic-class 6
qos map traffic-class 5 to dscp 46
!
class-map type qos match-any CM-VOICE
   match ip access-group ACL-QOS-VOICE
!
class-map type qos match-any CM-SCRUB
   match ip access-group ACL-PBR-SCRUBBER
!
ip access-list ACL-QOS-VOICE
   10 permit udp any any range 16384 32767
   20 permit tcp any any eq 5060 5061
!
policy-map type quality-of-service PM-ACCESS-IN
   class CM-VOICE
      set dscp ef
      police rate 50 mbps burst-size 1 mbytes
   class class-default
      set dscp default
!
policy-map type pbr PBR-SCRUBBER
   10 class CM-PBR-SCRUB
      set nexthop 10.255.200.1
!
class-map type pbr match-any CM-PBR-SCRUB
   10 match ip access-group ACL-PBR-SCRUBBER
!
qos profile QP-FABRIC
   qos trust dscp
   tx-queue 7
      priority strict
   tx-queue 6
      priority strict
      shape rate 5 percent
   tx-queue 5
      priority strict
      shape rate 20 percent
   tx-queue 4
      no priority
      bandwidth percent 30
   tx-queue 3
      no priority
      bandwidth percent 20
   tx-queue 2
      no priority
      bandwidth percent 15
   tx-queue 0
      no priority
      bandwidth percent 10
!
qos profile QP-EDGE
   qos trust dscp
   tx-queue 5
      priority strict
      shape rate 15 percent
   tx-queue 0
      no priority
      bandwidth percent 50
!
! -----------------------------------------------------------------------------
! Control-plane policing
! -----------------------------------------------------------------------------
system control-plane
   ip access-group default-control-plane-acl in
   ip access-group ACL-CPP-MGMT vrf MGMT in
!
ip access-list ACL-CPP-MGMT
   10 permit tcp 10.100.0.0/23 any eq ssh https 6030 830
   20 permit udp 10.100.0.0/23 any eq snmp ntp
   30 permit icmp any any
   40 permit udp any any eq bootps bootpc
   1000 deny ip any any
!
policy-map type copp copp-system-policy
   class copp-system-bgp
      shape pps 5000
   class copp-system-bfd
      shape pps 10000
   class copp-system-lacp
      shape pps 2000
   class copp-system-ipmcmiss
      shape pps 1000
   class copp-system-default
      shape pps 2000
!
! -----------------------------------------------------------------------------
! MACsec (DCI links)
! -----------------------------------------------------------------------------
mac security
   fips restrictions
   license SEC-LIC <LICENSE_PLACEHOLDER>
   profile MACSEC-DCI
      cipher aes256-gcm-xpn
      key 0a 7 <CAK_PLACEHOLDER>
      mka key-server priority 10
      mka session rekey-period 3600
      sci
      l2-protocol lldp bypass
!
! -----------------------------------------------------------------------------
! 802.1X (out-of-band legacy access ports)
! -----------------------------------------------------------------------------
dot1x system-auth-control
dot1x protocol lldp bypass
dot1x dynamic-authorization
!
! -----------------------------------------------------------------------------
! PTP (boundary clock for trading/analytics hosts)
! -----------------------------------------------------------------------------
ptp clock-identity 00:1c:73:ff:fe:00:00:21
ptp mode boundary
ptp priority1 128
ptp priority2 21
ptp domain 24
ptp source ip 10.255.0.21
ptp message-type general dscp 46 default
ptp message-type event dscp 48 default
ptp monitor threshold offset-from-master 250
!
! -----------------------------------------------------------------------------
! Event monitoring / automation
! -----------------------------------------------------------------------------
event-monitor
!
event-handler BACKUP-ON-SAVE
   trigger on-startup-config
   action bash /mnt/flash/scripts/backup_config.sh
   delay 30
!
event-handler ISP-A-DOWN
   trigger on-intf Ethernet25/1 operstatus
   action bash logger -p local0.warning "ISP-A uplink state change on bl1-dc1"
   delay 5
!
event-handler HIGH-CPU
   trigger on-counters
      poll interval 60
      condition cpu.utilization > 85
   action bash logger -p local0.crit "CPU above 85 percent"
!
monitor connectivity
   interval 10
   no shutdown
   host ISP-A-GW
      ip 198.51.100.0
      local-interfaces Ethernet25/1
   host GOOGLE-DNS
      ip 8.8.8.8
      url https://dns.google
!
monitor session SPAN-DMZ source Port-Channel30 rx
monitor session SPAN-DMZ destination Ethernet32/1
monitor session SPAN-DMZ ip access-group ACL-PBR-SCRUBBER
!
! -----------------------------------------------------------------------------
! Physical / logical interfaces
! -----------------------------------------------------------------------------
interface Management1
   description OOB_MGMT
   vrf MGMT
   ip address 10.100.10.21/24
!
! --- Spine uplinks (underlay, eBGP unnumbered-style /31) ---
interface Ethernet1/1
   description P2P_SPINE1_Ethernet21/1
   mtu 9214
   no switchport
   ip address 10.0.1.1/31
   bfd interval 100 min-rx 100 multiplier 3
   service-profile QP-FABRIC
   sflow enable
!
interface Ethernet2/1
   description P2P_SPINE2_Ethernet21/1
   mtu 9214
   no switchport
   ip address 10.0.1.3/31
   bfd interval 100 min-rx 100 multiplier 3
   service-profile QP-FABRIC
   sflow enable
!
interface Ethernet3/1
   description P2P_SPINE3_Ethernet21/1
   mtu 9214
   no switchport
   ip address 10.0.1.5/31
   bfd interval 100 min-rx 100 multiplier 3
   service-profile QP-FABRIC
   sflow enable
!
interface Ethernet4/1
   description P2P_SPINE4_Ethernet21/1
   mtu 9214
   no switchport
   ip address 10.0.1.7/31
   bfd interval 100 min-rx 100 multiplier 3
   service-profile QP-FABRIC
   sflow enable
!
! --- MLAG peer-link ---
interface Ethernet29/1
   description MLAG_PEER_bl2-dc1_Ethernet29/1
   channel-group 1000 mode active
!
interface Ethernet30/1
   description MLAG_PEER_bl2-dc1_Ethernet30/1
   channel-group 1000 mode active
!
interface Port-Channel1000
   description MLAG_PEER_bl2-dc1_Po1000
   switchport mode trunk
   switchport trunk group LEAF_PEER_L3
   switchport trunk group MLAG
   switchport trunk allowed vlan 2-4094
   spanning-tree link-type point-to-point
   no qos trust
   storm-control broadcast level 5
!
! --- Dual-homed firewall cluster (MLAG) ---
interface Ethernet9/1
   description FW-CLUSTER-1_eth1
   channel-group 10 mode active
!
interface Port-Channel10
   description FW-CLUSTER-1_LAG
   switchport mode trunk
   switchport trunk allowed vlan 100,110,120,300,310
   mlag 10
   spanning-tree portfast
   spanning-tree bpduguard enable
   storm-control broadcast level 1
   storm-control multicast level 5
   storm-control unknown-unicast level 1
   lacp fallback individual
   lacp fallback timeout 30
   port-channel lacp fallback static
!
! --- EVPN all-active multihoming (ESI) to load balancers ---
interface Ethernet10/1
   description LB-PAIR_ESI_eth1
   channel-group 20 mode active
!
interface Port-Channel20
   description LB-PAIR_ESI_LAG
   switchport mode trunk
   switchport trunk allowed vlan 300,310
   evpn ethernet-segment
      identifier 0000:0000:0021:0022:0020
      route-target import 00:21:00:22:00:20
      designated-forwarder election algorithm preference value 200
   lacp system-id 0021.0022.0020
   service-policy type qos input PM-ACCESS-IN
   spanning-tree portfast
!
! --- DMZ server port-channel with SPAN source ---
interface Ethernet11/1
   description DMZ-WEB-01_eth0
   channel-group 30 mode active
!
interface Port-Channel30
   description DMZ-WEB-01_LAG
   switchport access vlan 300
   mlag 30
   ip access-group ACL-DMZ-IN in
   spanning-tree portfast
   storm-control all level 2
!
! --- Legacy OOB access port with 802.1X / port-security ---
interface Ethernet12/1
   description LEGACY-BMC-PANEL
   switchport access vlan 900
   switchport port-security
   switchport port-security mac-address maximum 2
   switchport port-security violation protect
   dot1x pae authenticator
   dot1x authentication failure action traffic allow vlan 900
   dot1x reauthentication
   dot1x port-control auto
   dot1x host-mode multi-host authenticated
   dot1x mac based authentication
   dot1x timeout reauth-period 3600
   mac access-group MACL-PROTECT-LEGACY in
   spanning-tree portfast
   spanning-tree bpduguard enable
!
! --- PTP host port ---
interface Ethernet13/1
   description ANALYTICS-01_PTP_eth0
   switchport access vlan 110
   ptp enable
   ptp announce interval 0
   ptp sync-message interval -3
   ptp delay-mechanism e2e
   ptp transport ipv4
   spanning-tree portfast
!
! --- Legacy OSPF core ---
interface Ethernet20/1
   description LEGACY-CORE-01_Te1/1
   mtu 1500
   no switchport
   vrf PROD
   ip address 172.20.255.1/30
   ip ospf network point-to-point
   ip ospf authentication message-digest
   ip ospf message-digest-key 1 sha256 7 <OSPF_KEY_PLACEHOLDER>
   ip ospf area 0.0.0.0
   ip ospf cost 50
   bfd interval 300 min-rx 300 multiplier 3
!
