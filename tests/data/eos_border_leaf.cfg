      neighbor ISP-A remote-as 64496
      neighbor ISP-A local-as 65021 no-prepend replace-as
      neighbor ISP-A password 7 <ISP_A_PW>
      neighbor ISP-A bfd
      neighbor ISP-A ttl maximum-hops 1
      neighbor ISP-A route-map RM-ISP-A-IN in
      neighbor ISP-A route-map RM-ISP-A-OUT out
