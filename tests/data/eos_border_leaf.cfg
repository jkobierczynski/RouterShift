! Routing
! -----------------------------------------------------------------------------
ip routing
ip routing vrf PROD
ip routing vrf DEV
ip routing vrf DMZ
ip routing vrf INET
no ip routing vrf MGMT
ipv6 unicast-routing
ipv6 unicast-routing vrf DMZ
ipv6 unicast-routing vrf INET
ipv6 unicast-routing vrf PROD
!
