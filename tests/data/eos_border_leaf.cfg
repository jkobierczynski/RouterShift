         neighbor 198.51.100.2 activate
      !
      address-family ipv6
         neighbor 2001:db8:ffff:a:: activate
         neighbor 2001:db8:ffff:b:: activate
         network 2001:db8:203::/48
   !
   vrf PROD
      rd 10.255.0.21:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.255.0.21
      neighbor 10.255.251.1 peer group MLAG-IPv4-UNDERLAY-PEER
      redistribute connected
      redistribute ospf match internal
      redistribute ospf match external
      !
      address-family ipv6
         redistribute connected
!
! -----------------------------------------------------------------------------
! RPKI origin validation on Internet edge
! -----------------------------------------------------------------------------
router bgp 65021
   rpki cache RPKI-1
      host 10.100.0.80 vrf MGMT port 3323
      preference 1
      refresh-interval 600
   rpki cache RPKI-2
      host 10.100.1.80 vrf MGMT port 3323
      preference 2
   vrf INET
      rpki origin-validation
         ebgp local
         send extended-community
!
route-map RM-ISP-A-IN deny 5
   match origin-as validity invalid
!
route-map RM-ISP-B-IN deny 5
   match origin-as validity invalid
!
! -----------------------------------------------------------------------------
! Router general / maintenance mode
! -----------------------------------------------------------------------------
router general
   router-id ipv4 10.255.0.21
   vrf PROD
      leak routes source-vrf INET subscribe-policy RM-INET-TO-EVPN
!
maintenance
   profile bgp GRACEFUL-DRAIN
      initiator route-map RM-MAINT-DRAIN inout
   profile unit GRACEFUL-UNIT
      on-boot duration 600
   unit System
      profile unit GRACEFUL-UNIT
!
route-map RM-MAINT-DRAIN permit 10
   set as-path prepend 65021 65021 65021 65021
   set local-preference 0
   set community no-advertise additive
!
! -----------------------------------------------------------------------------
! DHCP relay global, ARP / ND tuning, IP SLA-style reflector
! -----------------------------------------------------------------------------
dhcp relay
   tunnel requests disabled
   mlag peer-link requests disabled
!
arp aging timeout default 1500
ip arp inspection vlan 900
ip dhcp snooping
ip dhcp snooping vlan 900
ip dhcp snooping information option
!
monitor twamp
   twamp-light
      reflector defaults
         listen port 862
!
! -----------------------------------------------------------------------------
! Interface-level ECN/WRED on fabric uplinks
! -----------------------------------------------------------------------------
interface Ethernet1/1-4/1
   tx-queue 3
      random-detect ecn minimum-threshold 500 kbytes maximum-threshold 1500 kbytes max-mark-probability 20
!
end
