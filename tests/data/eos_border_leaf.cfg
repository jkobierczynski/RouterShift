      neighbor ISP-B route-map RM-ISP-B-IN in
      neighbor ISP-B route-map RM-ISP-B-OUT out
      neighbor ISP-B maximum-routes 1100000 warning-limit 90 percent
      neighbor ISP-B remove-private-as all replace-as
      neighbor 198.51.100.0 peer group ISP-A
      neighbor 198.51.100.0 description ISP-A_PE1
      neighbor 198.51.100.2 peer group ISP-B
      neighbor 198.51.100.2 description ISP-B_PE7
      neighbor 2001:db8:ffff:a:: peer group ISP-A
      neighbor 2001:db8:ffff:b:: peer group ISP-B
      network 203.0.113.0/24
