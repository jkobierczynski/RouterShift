   vrf INET
      rd 10.255.0.21:50004
      route-target import evpn 50003:50003
      route-target export evpn 50004:50004
      route-target export evpn route-map RM-INET-TO-EVPN
      router-id 10.255.0.21
      bgp bestpath med missing-as-worst
