router ospf 100 vrf PROD
   router-id 10.255.0.21
   bfd default
   passive-interface default
   no passive-interface Ethernet20/1
   distribute-list route-map RM-OSPF-LEGACY-IN in
   redistribute bgp route-map RM-BGP-TO-OSPF
   max-lsa 12000 75 ignore-time 5 ignore-count 5 reset-time 5
   timers spf delay initial 50 200 5000
   timers lsa rx min interval 100
   graceful-restart
   log-adjacency-changes detail
!
! -----------------------------------------------------------------------------
! BFD global
! -----------------------------------------------------------------------------
router bfd
   multihop interval 300 min-rx 300 multiplier 3
   slow-timer 2000
!
! -----------------------------------------------------------------------------
! BGP: underlay + EVPN overlay + tenant VRFs + Internet edge
! -----------------------------------------------------------------------------
router bgp 65021
   router-id 10.255.0.21
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4 ecmp 4
   bgp bestpath as-path multipath-relax
   graceful-restart restart-time 300
   graceful-restart
   bgp asn notation asdot
   timers bgp 5 15
   !
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS remote-as 65000
   neighbor IPv4-UNDERLAY-PEERS password 7 <BGP_UNDERLAY_PW>
   neighbor IPv4-UNDERLAY-PEERS bfd
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 12000
   !
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65021
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description bl2-dc1
   neighbor MLAG-IPv4-UNDERLAY-PEER password 7 <BGP_MLAG_PW>
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 12000
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   !
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS remote-as 65000
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS password 7 <BGP_EVPN_PW>
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   !
   neighbor DCI-EVPN-PEERS peer group
   neighbor DCI-EVPN-PEERS remote-as 65121
   neighbor DCI-EVPN-PEERS update-source Loopback0
   neighbor DCI-EVPN-PEERS ebgp-multihop 5
   neighbor DCI-EVPN-PEERS bfd
   neighbor DCI-EVPN-PEERS password 7 <BGP_DCI_PW>
   neighbor DCI-EVPN-PEERS send-community
   neighbor DCI-EVPN-PEERS maximum-routes 0
   !
   neighbor 10.0.1.0 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.0.1.0 description spine1-dc1_Ethernet21/1
   neighbor 10.0.1.2 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.0.1.2 description spine2-dc1_Ethernet21/1
   neighbor 10.0.1.4 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.0.1.4 description spine3-dc1_Ethernet21/1
   neighbor 10.0.1.6 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.0.1.6 description spine4-dc1_Ethernet21/1
   neighbor 10.255.251.1 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.10.0.1 remote-as 65121
   neighbor 10.10.0.1 description bl1-dc2_DCI_underlay
   neighbor 10.10.0.1 bfd
   neighbor 10.10.0.1 password 7 <BGP_DCI_PW>
   neighbor 10.255.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.1 description spine1-dc1
   neighbor 10.255.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.2 description spine2-dc1
   neighbor 10.255.0.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.3 description spine3-dc1
   neighbor 10.255.0.4 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.4 description spine4-dc1
   neighbor 10.254.0.21 peer group DCI-EVPN-PEERS
   neighbor 10.254.0.21 description bl1-dc2_EVPN_gateway
   !
   redistribute connected route-map RM-CONN-TO-BGP
   !
   vlan-aware-bundle PROD
      rd 10.255.0.21:50001
      route-target both 50001:50001
      redistribute learned
      redistribute igmp
      vlan 100,110,120
   !
   vlan-aware-bundle DEV
      rd 10.255.0.21:50002
      route-target both 50002:50002
      redistribute learned
      vlan 200,210
   !
   vlan-aware-bundle DMZ
      rd 10.255.0.21:50003
      route-target both 50003:50003
      redistribute learned
      vlan 300,310
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
      neighbor DCI-EVPN-PEERS activate
      neighbor DCI-EVPN-PEERS domain remote
      neighbor default next-hop-self received-evpn-routes route-type ip-prefix inter-domain
      domain identifier 65021:1
      domain identifier 65121:1 remote
      route import match-failure action discard
      host-flap detection window 180 threshold 5 expiry timeout 600
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
      neighbor 10.10.0.1 activate
   !
   vrf DEV
      rd 10.255.0.21:50002
      route-target import evpn 50002:50002
      route-target export evpn 50002:50002
      router-id 10.255.0.21
      neighbor 10.255.251.1 peer group MLAG-IPv4-UNDERLAY-PEER
      redistribute connected
   !
   vrf DMZ
      rd 10.255.0.21:50003
      route-target import evpn 50003:50003
      route-target import evpn 65021:400
      route-target export evpn 50003:50003
      route-target export evpn route-map RM-EVPN-EXPORT-DMZ
      router-id 10.255.0.21
      neighbor 10.255.251.1 peer group MLAG-IPv4-UNDERLAY-PEER
      redistribute connected
      redistribute static
