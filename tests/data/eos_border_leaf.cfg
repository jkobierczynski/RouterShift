ip route vrf INET 203.0.113.0/24 Null0 name PUBLIC-AGG-ANCHOR
ipv6 route vrf INET 2001:db8:203::/48 Null0 name PUBLIC-AGG6-ANCHOR
ip route vrf PROD 10.255.200.1/32 10.1.110.250 track ISP-A-TRACK name SCRUBBER-NH
!
ip load-sharing trident fields ip source-ip destination-ip source-port destination-port
!
