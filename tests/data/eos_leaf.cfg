! Command: show running-config
! device: leaf-01 (DCS-7050SX3-48YC8, EOS-4.31.2F)
!
transceiver qsfp default-mode 4x10G
!
hostname leaf-01
dns domain dc.example.net
ip name-server vrf MGMT 10.0.0.53
!
ntp server vrf MGMT 10.0.0.123
!
spanning-tree mode mstp
!
vlan 100
   name SERVERS
!
vlan 200
   name STORAGE
!
vrf instance MGMT
!
vrf instance PROD
!
interface Ethernet1
   description server-01
   switchport access vlan 100
   spanning-tree portfast
!
interface Ethernet2
   description server-02
   switchport mode trunk
   switchport trunk allowed vlan 100,200
!
interface Ethernet49/1
   description spine-01
   mtu 9214
   no switchport
   ip address 10.255.0.1/31
   ip nat source static 10.100.0.10 10.255.0.10
   ip nat source dynamic access-list NAT-SRC overload
!
interface Ethernet50/1
   description spine-02
   channel-group 10 mode active
!
interface Ethernet51/1
   description spine-02
   channel-group 10 mode active
!
interface Tunnel1
   ip address 172.16.1.1/30
   tunnel mode gre
   tunnel source interface Ethernet49/1
   tunnel destination 203.0.113.17
   tunnel ipsec profile VTI
!
interface Loopback0
   ip address 10.255.255.1/32
!
interface Management1
   vrf MGMT
   ip address 192.168.255.21/24
!
interface Port-Channel10
   switchport mode trunk
   switchport trunk allowed vlan 100,200
!
interface Vlan100
   vrf PROD
   ip address 10.100.0.1/24
   ip helper-address 10.0.0.67
   ip access-group SERVERS-IN in
   dhcp server ipv4
   ip virtual-router address 10.100.0.254
!
ip access-list SERVERS-IN
   10 permit tcp 10.100.0.0/24 any eq https
   20 permit udp any host 10.0.0.53 eq domain
   30 deny ip any any log
!
ip access-list standard NAT-SRC
   10 permit 10.100.0.0/24
!
ip security
   ike policy IKE-AES
      encryption aes256
      integrity sha256
      dh-group 14
      ike-lifetime 8
   sa policy SA-AES
      esp encryption aes256
      esp integrity sha256
      pfs dh-group 14
      sa lifetime 1 hours
   profile VTI
      ike-policy IKE-AES
      sa-policy SA-AES
      connection start
      shared-key 7 0110100A1C5A
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
ip routing vrf PROD
!
ip route 0.0.0.0/0 10.255.0.0
ip route vrf MGMT 0.0.0.0/0 192.168.255.1
ip route vrf PROD 10.200.0.0/16 Null0
!
dhcp server vrf PROD
   dns domain name ipv4 example.net
   subnet 10.100.0.0/24
      name SERVERS
      range 10.100.0.100 10.100.0.199
      default-gateway 10.100.0.1
      dns server 10.0.0.53
      lease time 1 days 0 hours 0 minutes
!
router ospf 10 vrf PROD
   router-id 10.255.255.1
   network 10.100.0.0/24 area 0.0.0.1
   area 0.0.0.1 stub
   max-lsa 12000
!
router bgp 65001
   router-id 10.255.255.1
   neighbor SPINE peer group
   neighbor SPINE remote-as 65000
   neighbor SPINE send-community
   neighbor 10.255.0.0 peer group SPINE
   neighbor 10.255.255.9 remote-as 65001
   neighbor 10.255.255.9 update-source Loopback0
   neighbor 10.255.255.9 next-hop-self
   neighbor 10.255.255.9 description leaf-2
   network 10.255.255.1/32
   redistribute connected
!
management api http-commands
   no shutdown
!
end
