feature bgp
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
feature fabric forwarding
feature vpc
feature lacp
nv overlay evpn
hostname leaf1
fabric forwarding anycast-gateway-mac 001c.7300.dc01
vlan 100
  name PROD-WEB
  vn-segment 10100
vlan 200
  vn-segment 10200
vlan 3001
  vn-segment 50001
vrf context PROD
  vni 50001
  rd 10.255.0.1:1
  address-family ipv4 unicast
    route-target import 65000:50001 evpn
    route-target export 65000:50001 evpn
vpc domain 10
  peer-switch
  delay restore orphan-port 330
  role priority 100
  peer-keepalive destination 192.168.0.2 source 192.168.0.1 vrf management
  delay restore 300
  peer-gateway
  auto-recovery
  ip arp synchronize
interface port-channel10
  switchport
  switchport mode trunk
  vpc peer-link
interface port-channel20
  switchport
  switchport mode trunk
  vpc 20
interface Ethernet1/49
  switchport
  switchport mode trunk
  channel-group 10 mode active
interface Ethernet1/1
  switchport
  switchport mode trunk
  channel-group 20 mode active
interface Vlan100
  no shutdown
  vrf member PROD
  ip address 10.1.100.1/24
  fabric forwarding mode anycast-gateway
interface Vlan3001
  no shutdown
  vrf member PROD
  ip forward
interface loopback1
  ip address 10.255.1.1/32
interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  member vni 10100
    ingress-replication protocol bgp
  member vni 10200
    mcast-group 239.1.1.200
  member vni 50001 associate-vrf
evpn
  vni 10100 l2
    rd auto
    route-target import 65000:10100
    route-target export 65000:10100
  vni 10200 l2
    rd auto
    route-target import auto
    route-target export auto
router bgp 65001
  router-id 10.255.0.1
  timers bgp 10 30
  graceful-restart restart-time 300
  bestpath as-path multipath-relax
  address-family ipv4 unicast
    aggregate-address 10.1.0.0/16 summary-only
    distance 20 200 220
  template peer SPINES
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community extended
  neighbor 10.0.0.1
    inherit peer SPINES
  vrf PROD
    address-family ipv4 unicast
      aggregate-address 10.1.100.0/22 as-set summary-only
      redistribute direct route-map RS-PERMIT-ALL
    address-family ipv6 unicast
      redistribute direct route-map RS-PERMIT-ALL
    neighbor 10.9.9.9
      remote-as 65100
      address-family ipv4 unicast
route-map RS-PERMIT-ALL permit 10
interface mgmt0
  vrf member management
  ip address 192.168.0.1/24
