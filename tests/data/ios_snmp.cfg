hostname r1
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
ntp authentication-key 1 md5 NtpK3y
ntp authentication-key 2 md5 0822455D0A16 7
ntp trusted-key 1
ntp authenticate
ntp source Loopback0
ntp server 10.0.0.123 key 1 prefer
ntp server 10.0.0.124 key 1
snmp-server community s3cret RO MGMT-ONLY
snmp-server community wr1te RW
snmp-server location Brussels DC1 rack 4
snmp-server contact noc@example.net
snmp-server group NMS v3 priv read ALL
snmp-server user nms NMS v3 auth sha AuthPass1 priv aes 128 PrivPass1
snmp-server enable traps snmp linkdown linkup
snmp-server enable traps config
snmp-server host 10.0.5.20 version 2c s3cret
snmp-server host 10.0.5.21 informs version 3 priv nms
snmp-server trap-source Loopback0
ip access-list standard MGMT-ONLY
 10 permit 192.168.255.0 0.0.0.255
