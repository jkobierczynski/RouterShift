version 21.4R3-S5.4;
system {
    host-name core-01;
    domain-name example.net;
    domain-search corp.example.net;
    time-zone Europe/Brussels;
    root-authentication {
        encrypted-password "$6$abcd$RootHashValue"; ## SECRET-DATA
    }
    name-server {
        10.0.0.53;
    }
    static-host-mapping {
        nms-01 inet 10.0.5.20;
    }
    login {
        message "Authorised access only.";
        user netops {
            uid 2001;
            class super-user;
            authentication {
                encrypted-password "$6$salt$0123456789abcdef"; ## SECRET-DATA
            }
        }
        user viewer {
            uid 2002;
            class read-only;
            authentication {
                encrypted-password "$1$salt$abcdefgh"; ## SECRET-DATA
            }
        }
    }
    services {
        ssh;
        netconf {
            ssh;
        }
    }
    syslog {
        host 10.0.5.14 {
            any warning;
        }
        source-address 10.255.255.11;
    }
    ntp {
        authentication-key 1 type md5 value "$9$abcdefgh"; ## SECRET-DATA
        server 10.0.0.123 key 1 prefer;
        server 10.0.0.124;
        trusted-key 1;
        source-address 10.255.255.11;
    }
}
chassis {
    aggregated-devices {
        ethernet {
            device-count 4;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "desk 1.01";
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members USERS;
                }
            }
        }
    }
    ge-0/0/1 {
        description spare;
        disable;
        unit 0 {
            family ethernet-switching {
                vlan {
                    members 10;
                }
            }
        }
    }
    xe-0/1/0 {
        ether-options {
            802.3ad ae0;
        }
    }
    xe-0/1/1 {
        ether-options {
            802.3ad ae0;
        }
    }
    xe-0/1/2 {
        description wan;
        mtu 9192;
        unit 0 {
            family inet {
                address 10.255.0.10/31;
            }
        }
    }
    xe-0/1/3 {
        description "to router";
        vlan-tagging;
        unit 100 {
            vlan-id 100;
            family inet {
                address 192.0.2.1/30;
            }
        }
    }
    ae0 {
        description "uplink dist";
        native-vlan-id 99;
        aggregated-ether-options {
            lacp {
                active;
            }
        }
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ USERS VOICE MGMT ];
                }
            }
        }
    }
    irb {
        unit 10 {
            family inet {
                address 10.10.0.1/24;
            }
        }
        unit 99 {
            family inet {
                address 10.99.0.1/24;
            }
            family inet6 {
                address 2001:db8:99::1/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.255.11/32;
            }
        }
    }
    me0 {
        unit 0 {
            family inet {
                address 192.168.255.11/24;
            }
        }
    }
}
snmp {
    location "Building 1";
    contact noc@example.net;
    community r3adonly {
        authorization read-only;
    }
}
routing-options {
    router-id 10.255.255.11;
    autonomous-system 65010;
    static {
        route 0.0.0.0/0 next-hop 10.255.0.11;
        route 10.200.0.0/16 discard;
        route 10.50.0.0/16 {
            next-hop 10.99.0.2;
            preference 250;
        }
    }
}
protocols {
    ospf {
        reference-bandwidth 100g;
        area 0.0.0.0 {
            interface xe-0/1/2.0 {
                interface-type p2p;
                metric 10;
            }
            interface lo0.0 {
                passive;
            }
            interface irb.99 {
                metric 50;
            }
        }
    }
    bgp {
        group CORE {
            type external;
            peer-as 65000;
            neighbor 10.255.0.11 {
                description core;
                bfd-liveness-detection {
                    minimum-interval 300;
                }
            }
        }
        group RR {
            type internal;
            local-address 10.255.255.11;
            family inet {
                unicast;
            }
            family evpn {
                signaling;
            }
            neighbor 10.255.255.1;
            neighbor 10.255.255.2;
        }
    }
    lldp {
        interface all;
        interface ge-0/0/1 {
            disable;
        }
    }
    rstp {
        bridge-priority 8k;
        interface ge-0/0/0 {
            edge;
        }
        interface ae0 {
            cost 2000;
        }
        bpdu-block-on-edge;
    }
}
vlans {
    MGMT {
        vlan-id 99;
        l3-interface irb.99;
    }
    USERS {
        vlan-id 10;
        l3-interface irb.10;
    }
    VOICE {
        vlan-id 20;
    }
    default {
        vlan-id 1;
    }
}
routing-instances {
    PROD {
        instance-type vrf;
        interface irb.10;
        route-distinguisher 65010:10;
        vrf-target target:65000:10;
        routing-options {
            static {
                route 10.210.0.0/16 next-hop 10.10.0.254;
            }
            router-id 10.255.255.11;
        }
        protocols {
            ospf {
                area 0.0.0.1 {
                    stub no-summaries;
                    interface irb.10 {
                        passive;
                    }
                }
            }
        }
    }
}
